[project]
name = "acms"
version = "0.1.0"
description = "Agentic Commerce Management System: a store dashboard with an AI chat sales assistant"
readme = "README.md"
authors = [
    { name = "AzgarRiad", email = "azgarriad@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.42.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.52.4",
]

[project.scripts]
acms = "acms:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
